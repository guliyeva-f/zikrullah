name: amal_app
description: "İbadət və əməlləri gündəlik izləmək üçün şəxsi yardımçı."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2+1
  path: ^1.9.1
  flutter_riverpod: ^3.3.1
  timezone: ^0.11.0
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  intl: ^0.20.2
  share_plus: ^13.1.0
  file_picker: ^12.0.0-beta.1
  flutter_timezone: ^5.1.0
  path_provider: ^2.1.5
  app_settings: ^7.0.0
  flutter_local_notifications: ^21.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.7+1
flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito/Nunito-Regular.ttf
          weight: 400
        - asset: fonts/Nunito/Nunito-Medium.ttf
          weight: 500
        - asset: fonts/Nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito/Nunito-Bold.ttf
          weight: 700
        - asset: fonts/Nunito/Nunito-ExtraBold.ttf
          weight: 800
    - family: Scheherazade New
      fonts:
        - asset: fonts/ScheherazadeNew/ScheherazadeNew-Regular.ttf
          weight: 400
        - asset: fonts/ScheherazadeNew/ScheherazadeNew-Medium.ttf
          weight: 500
        - asset: fonts/ScheherazadeNew/ScheherazadeNew-SemiBold.ttf
          weight: 600
        - asset: fonts/ScheherazadeNew/ScheherazadeNew-Bold.ttf
          weight: 700
