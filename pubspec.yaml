name: zikrullah
description: "İbadət və əməlləri gündəlik izləmək üçün şəxsi yardımçı."
publish_to: "none"
version: 1.0.0
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2+1
  path: ^1.9.1
  flutter_riverpod: ^3.3.1
  timezone: ^0.11.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  share_plus: ^13.1.0
  file_picker: ^12.0.0-beta.1
  flutter_timezone: ^5.1.0
  path_provider: ^2.1.5
  app_settings: ^7.0.0
  flutter_local_notifications: ^22.0.1
  package_info_plus: ^10.1.0
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.7+1
flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/Roboto-Black.ttf
          weight: 800
    - family: Scheherazade New
      fonts:
        - asset: assets/fonts/Scheherazade/ScheherazadeNew-Regular.ttf
          weight: 400
        - asset: assets/fonts/Scheherazade/ScheherazadeNew-Medium.ttf
          weight: 500
        - asset: assets/fonts/Scheherazade/ScheherazadeNew-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Scheherazade/ScheherazadeNew-Bold.ttf
          weight: 700
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 26
